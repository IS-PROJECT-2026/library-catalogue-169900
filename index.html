<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Library Catalogue</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">📚 City Library</div>
    <nav class="nav-links">
      <a href="#catalogue">Catalogue</a>
      <a href="#reading-list">My Reading List</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Discover Your Next Great Book</h1>

      <div class="search-bar">
        <label for="search-input" class="sr-only">Search books by title or author</label>
        <input
          type="text"
          id="search-input"
          placeholder="Search books, authors..."
          aria-label="Search books and authors"
        />
      </div>

      <div class="category-filters" id="category-filters">
        <button type="button" class="filter-chip active" data-category="all" aria-pressed="true">All</button>
        <button type="button" class="filter-chip" data-category="fiction" aria-pressed="false">Fiction</button>
        <button type="button" class="filter-chip" data-category="science" aria-pressed="false">Science</button>
        <button type="button" class="filter-chip" data-category="history" aria-pressed="false">History</button>
        <button type="button" class="filter-chip" data-category="technology" aria-pressed="false">Technology</button>
      </div>
    </section>

    <section class="catalogue-section" id="catalogue">
      <div class="book-grid" id="book-grid">
        <!-- Book cards render here via app.js -->
      </div>
    </section>

    <section class="reading-list-section" id="reading-list">
      <h2>My Reading List</h2>
      <ul id="reading-list-items" aria-live="polite"></ul>
      <p id="reading-list-empty">You haven't added any books yet — browse the catalogue above.</p>
    </section>
  </main>

  <footer class="site-footer">
    City Library Catalogue — a client-side demo project.
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      tabindex="-1"
    >
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-author" id="modal-author"></p>
      <p class="modal-category" id="modal-category"></p>
      <p class="modal-description" id="modal-description"></p>
      <p class="modal-availability" id="modal-availability"></p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
